# ============================================================
# WayGo - Configuracion de Nginx (frontend en produccion)
# Sirve la SPA y hace proxy de /api, /uploads y /socket.io
# hacia el servicio "backend" de la red de Docker.
# Nota: este archivo se coloca en /etc/nginx/conf.d/, que nginx
# incluye dentro del bloque "http", por lo que los map() de
# abajo son validos ahi.
# ============================================================

# En Dokploy hay DOS proxies delante de nginx (Traefik -> nginx).
# Traefik ya escribe la IP real del cliente en X-Forwarded-For.
# Si nginx la duplicara (proxy_add_x_forwarded_for) quedaria
#   "IP_cliente, IP_traefik"
# y Express, con trust proxy=1, tomaria la IP de Traefik como la
# del cliente. Todos los usuarios compartirian el mismo bucket de
# rate limiting (p.ej. 30 logins en /login serian GLOBALES).
# Con esto se respeta la cabecera original y, si no existe
# (acceso local sin Traefik), se usa la direccion del socket.
map $http_x_forwarded_for $waygo_xff {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

# Mismo criterio para el esquema: nginx escucha en http (80), pero
# el trafico real llega por HTTPS desde Traefik.
map $http_x_forwarded_proto $waygo_xfp {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Cabecera Connection de Socket.IO: "upgrade" solo cuando el
# cliente pide WebSocket; "close" el resto del tiempo.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx corta el cuerpo de la peticion en 1MB por defecto, pero
    # la API acepta hasta MAX_FILE_SIZE_MB (5MB). Sin esta linea,
    # subir fotos o documentos de conductor devuelve 413.
    client_max_body_size 10m;

    # Fallback de SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API REST
    # proxy_pass sin URI final -> se pasa la ruta completa
    # (/api/usuarios => http://backend:4000/api/usuarios)
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $waygo_xff;
        proxy_set_header X-Forwarded-Proto $waygo_xfp;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Archivos subidos (fotos y documentos)
    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $waygo_xff;
        proxy_set_header X-Forwarded-Proto $waygo_xfp;
    }

    # Socket.IO (tiempo real)
    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $waygo_xff;
        proxy_set_header X-Forwarded-Proto $waygo_xfp;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
